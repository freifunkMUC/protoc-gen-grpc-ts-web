# Docs: <https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference>

version: 2

# Minor and patch updates come as one PR per ecosystem; major updates stay separate.
updates:
  - package-ecosystem: gomod
    directory: /
    schedule: { interval: monthly }
    groups:
      go:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]

  # the CLI wrapper that ships in the npm package; example/ is left out, it is
  # not part of the package and nothing builds it

  - package-ecosystem: npm
    directory: /npm
    schedule: { interval: monthly }
    groups:
      npm:
        patterns: ["*"]
        update-types: [minor, patch]
