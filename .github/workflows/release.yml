name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write # lets npm authenticate via OIDC (trusted publishing)

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"

      # Trusted publishing needs npm >= 11.5.1 and Node >= 22.14.0, both well
      # below what Node 26 ships.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # A tag that disagrees with package.json would publish a version nobody
      # can trace back to a commit, so fail before anything is uploaded.
      - name: Check the tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./npm/package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag $GITHUB_REF_NAME implies version $tag, but npm/package.json says $pkg"
            exit 1
          fi

      - name: Build the plugin binaries
        run: make release

      - name: Check every advertised platform got a binary
        run: |
          for target in darwin-amd64 darwin-arm64 linux-amd64 linux-arm64 windows-amd64; do
            test -s "npm/bin/protoc-gen-grpc-ts-web-$target" || {
              echo "missing binary for $target"; exit 1; }
          done

      # No NPM_TOKEN: npm exchanges the OIDC token from id-token: write for a
      # short-lived credential. Provenance is attached automatically, so the
      # --provenance flag is not needed either.
      - name: Publish
        working-directory: npm
        run: |
          echo "npm $(npm --version), node $(node --version)"
          npm publish
