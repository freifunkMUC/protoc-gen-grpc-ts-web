name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  golangci-lint:
    name: Golang-CI (lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache: false

      - name: Run linter
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13 # without patch version
          args: --timeout 4m

  generate:
    name: Generate & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Build the plugin
        run: make build

      - name: Run the Go tests
        run: go test ./...

      - name: Generate a client from example.proto
        run: |
          for format in text binary; do
            mkdir -p .ci/gen/$format
            protoc \
              --plugin=bin/protoc-gen-grpc-ts-web \
              --grpc-ts-web_opt=format=$format \
              --grpc-ts-web_out=.ci/gen/$format \
              -I example example/example.proto
            test -s .ci/gen/$format/example_pb.ts
            grep -q "format: '$format'" .ci/gen/$format/example_pb.ts
          done

      # The npm package is a wrapper around the plugin. Run it the way users
      # do, so that a breaking dependency update or a swallowed protoc error
      # shows up here and not in somebody's codegen.
      - name: Test the CLI wrapper
        working-directory: npm
        run: |
          npm ci --no-audit --no-fund
          mkdir -p bin ../.ci
          cp ../bin/protoc-gen-grpc-ts-web "bin/protoc-gen-grpc-ts-web-linux-$(go env GOARCH)"

          node command.js -o ../.ci/cli-default ../example/example.proto
          grep -q "format: 'text'" ../.ci/cli-default/example_pb.ts

          node command.js --format binary -o ../.ci/cli-binary ../example/example.proto
          grep -q "format: 'binary'" ../.ci/cli-binary/example_pb.ts

          # an invalid value has to fail the command, not just print an error
          if node command.js --format json -o ../.ci/cli-invalid ../example/example.proto; then
            echo "an invalid format did not fail the CLI"
            exit 1
          fi

      - name: Typecheck the generated client
        working-directory: .ci
        run: |
          cat > package.json <<'JSON'
          {
            "name": "generated-client-typecheck",
            "version": "0.0.0",
            "private": true
          }
          JSON
          cat > tsconfig.json <<'JSON'
          {
            "compilerOptions": {
              "strict": true,
              "noEmit": true,
              "moduleResolution": "bundler",
              "target": "es2020",
              "module": "esnext",
              "skipLibCheck": true
            }
          }
          JSON
          npm install --no-audit --no-fund typescript@6 google-protobuf@4 @types/google-protobuf
          for version in 1.2.1 2; do
            echo "::group::grpc-web@$version"
            npm install --no-audit --no-fund "grpc-web@$version"
            npx tsc
            echo "::endgroup::"
          done
